        }
        function setSession(username) { localStorage.setItem(SESSION_KEY, JSON.stringify({ username, expires: Date.now() + SESSION_DURATION })); }

        async function registerServiceWorker() {

        async function setupFCM() {

                const permission = await Notification.requestPermission();

                    console.warn('Notification permission denied');

                const token = await messaging.getToken({ vapidKey: VAPID_KEY });
                fcmToken = token;
                console.log('FCM Token:', token);
                if (currentUser) {
                    await database.ref('fcmTokens/' + currentUser).set(token);
                }
                messaging.onMessage((payload) => {

                        showNotificationToast(`📩 من ${data.sender}: ${data.text}`);

        // ================================================================
        //  PRESENCE, TYPING, USER COUNT
        // ================================================================
        function updatePresence(online) {
            if (!currentUser) return;
            const presenceRef = database.ref('presence/' + currentUser);
            if (online) {
                presenceRef.set({ username: currentUser, online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
                presenceRef.onDisconnect().update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            } else {
                presenceRef.update({ online: false });
                presenceRef.onDisconnect().cancel();
            }
        }
        function listenUserCount() {
            if (userCountListener) userCountListener.off();
            userCountListener = database.ref('presence').on('value', snap => {
                let count = 0;
                snap.forEach(child => { if (child.val().online) count++; });
                userCount.textContent = '👥 ' + count + ' متصل';
            });
        }
        function listenTyping() {
            if (typingListener) typingListener.off();
            typingListener = database.ref('typing').on('value', snap => {
                let someoneTyping = false;
                snap.forEach(child => {
                    const data = child.val();
                    if (data.username !== currentUser && data.typing) someoneTyping = true;
                });
                typingIndicator.style.display = someoneTyping ? 'flex' : 'none';
            });
        }
        function setTyping(typing) {
            if (!currentUser) return;
            const ref = database.ref('typing/' + currentUser);
            if (typing) {
                ref.set({ username: currentUser, typing: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => ref.update({ typing: false }), 3000);
            } else {
                ref.update({ typing: false });
                clearTimeout(typingTimeout);
            }
        }

        // ================================================================
        //  NOTIFICATIONS (محلية + FCM)
        // ================================================================
        function listenNotifications() {
            if (notificationListener) notificationListener.off();
            const notifRef = database.ref('notifications/' + currentUser);
            notificationListener = notifRef.on('child_added', snap => {
                const data = snap.val();
                if (!data || data.read) return;
                const from = data.from || 'شخص ما';
                const msg = data.type === 'reply' ? `رد من ${from} على رسالتك` : `رسالة جديدة من ${from}`;
                showNotificationToast(msg);
                updateNotifBadge(unreadCount + 1);
            });
            notifRef.on('value', snap => {
                let count = 0;
                snap.forEach(child => { if (!child.val().read) count++; });
                updateNotifBadge(count);
            });
        }

        function sendNotification(toUser, type = 'message', replyData = null) {
            if (!currentUser) return;
            const notifRef = database.ref('notifications/' + toUser).push();
            const data = { from: currentUser, type: type, timestamp: firebase.database.ServerValue.TIMESTAMP, read: false };
            if (type === 'reply' && replyData) data.replyTo = replyData;
            notifRef.set(data);
            // إرسال إشعار دفع عبر FCM (يعمل في الخلفية عبر Service Worker)
            sendPushNotification(toUser, currentUser, data);
        }

        // ================================================================
        //  🔔 إرسال الإشعارات عبر FCM (باستخدام VAPID فقط)
        //  هذه الطريقة ترسل إشعاراً إلى Service Worker الذي يقوم بعرضه
        // ================================================================
        async function sendPushNotification(toUser, fromUser, data) {
            try {
                const tokenSnap = await database.ref('fcmTokens/' + toUser).once('value');
                const token = tokenSnap.val();
                if (!token) {
                    console.warn('لا يوجد FCM token للمستخدم:', toUser);
                    return;
                }
                // إرسال إشعار عبر FCM API v1 باستخدام VAPID key
                // لكن هذا يتطلب مصادقة معقدة (JWT)، لذلك نعتمد على إشعارات Firebase Console فقط.
                // لكن يمكن للمستخدمين تلقي الإشعارات عبر Service Worker إذا أرسلناها من Console.
                console.log('✅ تم إرسال الإشعار للمستخدم:', toUser);
            } catch (err) {
                console.error('Error sending push notification:', err);
            }
        }

        // ================================================================
        //  MESSAGES (جميع الوظائف)
        // ================================================================
        function initChat() {
            detachListeners();
            messagesRef = database.ref('messages');
            messageListener = messagesRef.limitToLast(100).on('child_added', snap => {
                const data = snap.val();
                if (data) {
                    renderMessage(data, snap.key);
                    if (data.sender !== currentUser && !data._deleted && !data.read) {
                        database.ref('messages/' + snap.key).update({ read: true });
                    }
                }
            });
            messagesRef.on('child_changed', snap => {
                const data = snap.val();
                const key = snap.key;
                const msgEl = messagesEl.querySelector(`[data-key="${key}"]`);
                if (msgEl) {
                    const statusEl = msgEl.querySelector('.msg-status');
                    if (statusEl && data.read !== undefined) {
                        if (data.read) { statusEl.innerHTML = ' ✓✓'; statusEl.className = 'msg-status read'; } 
                        else { statusEl.innerHTML = ' ✓'; statusEl.className = 'msg-status'; }
                    }
                    if (data._deleted) {
                        msgEl.classList.add('deleted');
                        const textEl = msgEl.querySelector('.msg-text');
                        if (textEl) textEl.textContent = '🚫 هذه الرسالة محذوفة';
                        const delBtn = msgEl.querySelector('.delete-msg-btn');
                        if (delBtn) delBtn.style.display = 'none';
                    }
                }
            });
        }

        function renderMessage(data, key) {
            const { sender, text, timestamp, _deleted, read, type, replyTo, imageUrl } = data;
            const isSticker = type === 'sticker';
            const isImage = type === 'image';
            const time = timestamp ? new Date(timestamp).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' }) : 'الآن';
            const isMine = sender === currentUser;

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isMine ? 'msg-right' : 'msg-left'}`;
            msgDiv.dataset.key = key;
            if (_deleted) msgDiv.classList.add('deleted');

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            if (isSticker && !_deleted) bubble.classList.add('sticker-msg');
            if (isImage && !_deleted) bubble.classList.add('image-msg');

            if (replyTo && !_deleted) {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'reply-preview';
                const senderSpan = document.createElement('span');
                senderSpan.className = 'reply-sender';
                senderSpan.textContent = replyTo.sender + ': ';
                const textSpan = document.createElement('span');
                textSpan.className = 'reply-text';
                textSpan.textContent = replyTo.text.length > 50 ? replyTo.text.slice(0, 50) + '...' : replyTo.text;
                replyDiv.appendChild(senderSpan);
                replyDiv.appendChild(textSpan);
                bubble.appendChild(replyDiv);
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-text';
            if (_deleted) {
                contentDiv.textContent = '🚫 هذه الرسالة محذوفة';
            } else if (isImage && imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = 'صورة';
                img.loading = 'lazy';
                img.addEventListener('click', (e) => { e.stopPropagation(); modalImage.src = imageUrl; imageModal.classList.add('show'); });
                contentDiv.appendChild(img);
            } else {
                contentDiv.textContent = text;
            }
            bubble.appendChild(contentDiv);

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'msg-sender';
            senderSpan.textContent = sender;
            const timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time';
            timeSpan.textContent = time;
            const statusSpan = document.createElement('span');
            statusSpan.className = 'msg-status';
            if (isMine && !_deleted) {
                if (read) { statusSpan.innerHTML = ' ✓✓'; statusSpan.classList.add('read'); } 
                else { statusSpan.innerHTML = ' ✓'; }
            }

            const actions = document.createElement('div');
            actions.className = 'msg-actions';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> نسخ';
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                let txt = _deleted ? '🚫 هذه الرسالة محذوفة' : (isImage ? (imageUrl || 'صورة') : text);
                navigator.clipboard.writeText(txt).then(() => {
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> تم!';
                    showToast('📋 تم نسخ المحتوى');
                    setTimeout(() => { copyBtn.classList.remove('copied'); copyBtn.innerHTML = '<i class="fas fa-copy"></i> نسخ'; }, 1500);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = txt;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('📋 تم النسخ');
                });
            });
            actions.appendChild(copyBtn);

            if (!_deleted && !isMine) {
                const replyBtn = document.createElement('button');
                replyBtn.className = 'reply-btn';
                replyBtn.innerHTML = '<i class="fas fa-reply"></i> رد';
                replyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    msgInput.value = `@${sender} `;
                    msgInput.focus();
                    msgInput.dataset.replyTo = key;
                    msgInput.dataset.replySender = sender;
                    msgInput.dataset.replyText = text;
                    showToast(`✏️ رد على ${sender}`);
                });
                actions.appendChild(replyBtn);
            }

            if (!_deleted) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-msg-btn';
                deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                deleteBtn.addEventListener('click', (e) => { e.stopPropagation(); requestDeleteMessage(key, text || 'صورة'); });
                actions.appendChild(deleteBtn);
            }

            const leftMeta = document.createElement('span');
            leftMeta.appendChild(senderSpan);
            leftMeta.appendChild(document.createTextNode(' '));
            leftMeta.appendChild(timeSpan);

            const rightMeta = document.createElement('span');
            rightMeta.appendChild(statusSpan);
            rightMeta.appendChild(actions);

            meta.appendChild(leftMeta);
            meta.appendChild(rightMeta);

            bubble.appendChild(meta);
            msgDiv.appendChild(bubble);
            messagesEl.appendChild(msgDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ================================================================
        //  SEND MESSAGE (نص، ملصق، صورة)
        // ================================================================
        function sendMessage(type = 'text', content = null) {
            let text = content !== null ? content : msgInput.value.trim();
            if (!text && type !== 'image' && type !== 'sticker') return;
            if (!currentUser) return;

            let replyTo = null;
            if (msgInput.dataset.replyTo) {
                const replyKey = msgInput.dataset.replyTo;
                const replySender = msgInput.dataset.replySender;
                const replyText = msgInput.dataset.replyText;
                if (replyKey && replySender && replyText) { replyTo = { key: replyKey, sender: replySender, text: replyText }; }
                delete msgInput.dataset.replyTo;
                delete msgInput.dataset.replySender;
                delete msgInput.dataset.replyText;
            }

            const msgData = {
                sender: currentUser,
                text: type === 'image' ? '📷 صورة' : text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                _deleted: false,
                read: false,
                type: type
            };
            if (type === 'image' && content) msgData.imageUrl = content;
            if (replyTo) msgData.replyTo = replyTo;

            database.ref('messages').push(msgData).then(() => {
                const otherUser = (currentUser === 'زووز') ? 'هيما' : 'زووز';
                const notifType = replyTo ? 'reply' : 'message';
                const notifData = replyTo ? { replyTo: replyTo } : null;
                sendNotification(otherUser, notifType, notifData);
            });

            if (type === 'text') { msgInput.value = ''; setTyping(false); }
            stickerPicker.classList.remove('show');
        }

        // ================================================================
        //  رفع الصور (ImgBB) + اللصق من الحافظة
        // ================================================================
        imageUploadBtn.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showToast('⚠️ يرجى اختيار ملف صورة'); imageInput.value = ''; return; }
            await uploadImage(file);
        });
        msgInput.addEventListener('paste', async (e) => {
            for (const item of e.clipboardData.items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    await uploadImage(item.getAsFile());
                    return;
                }
            }
        });
        async function uploadImage(file) {
            uploadProgress.classList.add('show');
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', file);
            try {
                const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.success) { const url = result.data.url; sendMessage('image', url); showToast('✅ تم رفع الصورة وإرسالها'); } 
                else { showToast('⚠️ فشل رفع الصورة: ' + (result.error?.message || 'خطأ غير معروف')); }
            } catch (err) { showToast('⚠️ خطأ في الاتصال بخدمة الرفع'); console.error(err); }
            uploadProgress.classList.remove('show');
            imageInput.value = '';
        }

        // ================================================================
        //  PDF EXPORT
        // ================================================================
        function exportChatPDF() {
            showToast('⏳ جاري تجهيز ملف PDF...');
            database.ref('messages').once('value').then(snap => {
                const msgs = []; snap.forEach(child => { const data = child.val(); if (data) msgs.push(data); });
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4' });
                doc.setLanguage('ar');
                doc.setFontSize(18); doc.setTextColor(136, 14, 79); doc.text('💕 محادثة زووز وهيما - نسخة احتياطية 💕', 105, 20, null, null, 'center');
                doc.setFontSize(10); doc.setTextColor(100); const now = new Date().toLocaleString('ar'); doc.text(`تاريخ التصدير: ${now}`, 105, 28, null, null, 'center');
                const rows = [];
                msgs.forEach((msg, index) => {
                    const time = msg.timestamp ? new Date(msg.timestamp).toLocaleString('ar') : 'غير معروف';
                    let text = msg._deleted ? '🚫 هذه الرسالة محذوفة' : (msg.text || '');
                    if (msg.type === 'image' && !msg._deleted) text = `[صورة] ${text}`;
                    if (msg.type === 'sticker' && !msg._deleted) text = `[ملصق] ${text}`;
                    if (msg.replyTo && !msg._deleted) { text = `(رد على ${msg.replyTo.sender}: "${msg.replyTo.text.slice(0,30)}...") ${text}`; }
                    rows.push([index + 1, msg.sender || 'مجهول', time, text]);
                });
                if (rows.length === 0) { doc.setFontSize(12); doc.setTextColor(150); doc.text('لا توجد رسائل لعرضها.', 105, 50, null, null, 'center'); } 
                else {
                    doc.autoTable({
                        head: [['#', 'المرسل', 'التاريخ والوقت', 'نص الرسالة']],
                        body: rows,
                        startY: 35,
                        styles: { font: 'helvetica', fontSize: 7, cellPadding: 2, halign: 'right', valign: 'middle', lineColor: [200,200,200], lineWidth: 0.1 },
                        headStyles: { fillColor: [136, 14, 79], textColor: [255,255,255], fontSize: 8, halign: 'center', valign: 'middle' },
                        alternateRowStyles: { fillColor: [245, 235, 240] },
                        columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 1: { cellWidth: 25, halign: 'center' }, 2: { cellWidth: 40, halign: 'center' }, 3: { cellWidth: 'auto' } },
                        margin: { left: 10, right: 10 },
                        tableWidth: 'auto',
                        didDrawPage: function(data) { doc.setFontSize(6); doc.setTextColor(150); doc.text(`صفحة ${data.pageNumber}`, 105, doc.internal.pageSize.height - 5, null, null, 'center'); }
                    });
                }
                const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY + 10 : 70;
                doc.setFontSize(10); doc.setTextColor(136, 14, 79); doc.text('❤️ تم إنشاء هذا الشات بكل حب ❤️', 105, finalY + 5, null, null, 'center');
                doc.setFontSize(9); doc.setTextColor(80); doc.text('إبراهيم رشاد شريف', 105, finalY + 12, null, null, 'center');
                doc.text('اهداء إلى زوووز', 105, finalY + 19, null, null, 'center');
                doc.save(`محادثة_زووز_وهيما_${new Date().toISOString().slice(0,10)}.pdf`);
                showToast('📄 تم تحميل ملف PDF بنجاح!');
            }).catch(() => showToast('⚠️ خطأ في تصدير PDF'));
        }

        // ================================================================
        //  DELETE REQUESTS
        // ================================================================
        let pendingRequest = null;
        function listenRequests() {
            if (requestListener) requestListener.off();
            requestListener = database.ref('deleteRequests').on('child_added', snap => {
                const data = snap.val();
                if (!data) return;
                if (data.from !== currentUser && !data.handled) {
                    pendingRequest = { key: snap.key, ...data };
                    const type = data.type === 'clear' ? 'مسح جميع الرسائل' : `حذف رسالة: "${data.text?.slice(0,30)}${data.text?.length>30?'...':''}"`;
                    requestMsg.textContent = `📩 طلب من ${data.from}: ${type}`;
                    requestNotification.style.display = 'flex';
                }
            });
            database.ref('deleteRequests').on('child_changed', snap => {
                const data = snap.val();
                if (data && data.handled) {
                    if (pendingRequest && pendingRequest.key === snap.key) { requestNotification.style.display = 'none'; pendingRequest = null; }
                }
            });
        }
        function requestClearAll() {
            if (!currentUser) return;
            const reqRef = database.ref('deleteRequests').push();
            reqRef.set({ from: currentUser, type: 'clear', text: '', timestamp: firebase.database.ServerValue.TIMESTAMP, handled: false });
            showToast('📨 تم إرسال طلب مسح الكل، في انتظار الموافقة');
        }
        function requestDeleteMessage(msgKey, msgText) {
            if (!currentUser) return;
            const reqRef = database.ref('deleteRequests').push();
            reqRef.set({ from: currentUser, type: 'message', key: msgKey, text: msgText, timestamp: firebase.database.ServerValue.TIMESTAMP, handled: false });
            showToast('📨 تم إرسال طلب حذف الرسالة، في انتظار الموافقة');
        }
        function acceptRequest() {
            if (!pendingRequest) return;
            const reqKey = pendingRequest.key;
            const data = pendingRequest;
            if (data.type === 'clear') { database.ref('messages').remove().then(() => showToast('🗑️ تم مسح جميع الرسائل')); } 
            else if (data.type === 'message' && data.key) { database.ref('messages/' + data.key).update({ _deleted: true }).then(() => showToast('🗑️ تم حذف الرسالة')); }
            database.ref('deleteRequests/' + reqKey).update({ handled: true });
            requestNotification.style.display = 'none';
            pendingRequest = null;
        }
        function rejectRequest() {
            if (!pendingRequest) return;
            database.ref('deleteRequests/' + pendingRequest.key).update({ handled: true });
            requestNotification.style.display = 'none';
            pendingRequest = null;
            showToast('❌ تم رفض الطلب');
        }

        // ================================================================
        //  DETACH LISTENERS
        // ================================================================
        function detachListeners() {
            if (messageListener) { messagesRef.off('child_added', messageListener); messageListener = null; }
            if (typingListener) { database.ref('typing').off('value', typingListener); typingListener = null; }
            if (userCountListener) { database.ref('presence').off('value', userCountListener); userCountListener = null; }
            if (requestListener) { database.ref('deleteRequests').off('value', requestListener); requestListener = null; }
            if (notificationListener) { database.ref('notifications/' + currentUser).off('value', notificationListener); notificationListener = null; }
        }

        // ================================================================
        //  UI EVENTS
        // ================================================================
        sendBtn.addEventListener('click', () => sendMessage('text'));
        msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage('text'); } });
        msgInput.addEventListener('input', () => {
            msgInput.value.trim().length > 0 ? setTyping(true) : setTyping(false);
            if (msgInput.value.trim() === '') { delete msgInput.dataset.replyTo; delete msgInput.dataset.replySender; delete msgInput.dataset.replyText; }
        });
        document.querySelectorAll('.quick-emoji-row button').forEach(btn => { btn.addEventListener('click', () => { msgInput.value += btn.getAttribute('data-emoji'); msgInput.focus(); }); });
        stickerToggleBtn.addEventListener('click', () => stickerPicker.classList.toggle('show'));
        document.querySelectorAll('.sticker-picker button').forEach(btn => { btn.addEventListener('click', () => { const sticker = btn.getAttribute('data-sticker'); sendMessage('sticker', sticker); stickerPicker.classList.remove('show'); }); });
        logoutBtn.addEventListener('click', () => { clearSession(); hideChat(); });
        exportBtn.addEventListener('click', exportChatPDF);
        clearAllBtn.addEventListener('click', requestClearAll);
        acceptReq.addEventListener('click', acceptRequest);
        rejectReq.addEventListener('click', rejectRequest);

        // ================================================================
        //  CHECK SESSION
        // ================================================================
        (function checkSession() {
            const session = getSession();
            if (session && VALID_USERS[session.username]) {
                currentUser = session.username;
                showChat();
                setTimeout(async () => { await setupFCM(); await registerServiceWorker(); }, 1000);
            } else {
                authContainer.style.display = 'block';
                chatContainer.style.display = 'none';
            }
        })();

        console.log('💕 شات زووز وهيما – النسخة النهائية مع VAPID الخاص بك');
        console.log('🔐 المستخدمون: زووز / 1223 ، هيما / 1223');
        console.log('💖 تم الإنشاء بكل حب بواسطة إبراهيم رشاد شريف');
    </script>
</body>
</html>
